[package]
name = "lumen-desktop"
version = "0.3.0"
description = "LUMEN personal assistant desktop shell"
edition = "2021"

[lib]
name = "lumen_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
